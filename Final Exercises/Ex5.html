<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 5 - Tabbed Content</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .tab-buttons { display: flex; gap: 5px; margin-bottom: 0; }
        .tab-btn {
            padding: 10px 20px;
            border: 1px solid #ccc;
            background: #f2f2f2;
            cursor: pointer;
        }
        .tab-btn.active {
            background: #4CAF50;
            color: white;
            font-weight: bold;
        }
        .tab-content {
            display: none;
            border: 1px solid #ccc;
            padding: 20px;
            width: 400px;
        }
        .tab-content.active { display: block; }
    </style>
</head>
<body>

<h2>Exercise 5 - Tabbed Content Interface</h2>

<div class="tab-buttons">
    <button class="tab-btn active" onclick="switchTab('features', this)">&#8594; Features &reg;</button>
    <button class="tab-btn" onclick="switchTab('pricing', this)">Pricing &euro;</button>
    <button class="tab-btn" onclick="switchTab('reviews', this)">Reviews</button>
    <button class="tab-btn" onclick="switchTab('support', this)">Support</button>
</div>

<div id="features" class="tab-content active">
    <h3>Features &reg;</h3>
    <p>Our product includes many great features for users.</p>
</div>
<div id="pricing" class="tab-content">
    <h3>Pricing &euro;</h3>
    <p>Basic: &euro;9/month &bull; Pro: &euro;19/month &bull; Enterprise: &euro;49/month</p>
</div>
<div id="reviews" class="tab-content">
    <h3>Reviews</h3>
    <p>"Great product!" - Customer A &#8594;</p>
    <p>"Very useful!" - Customer B &#8594;</p>
</div>
<div id="support" class="tab-content">
    <h3>Support</h3>
    <p>Contact us at support@example.com for help.</p>
</div>

<script>
    function switchTab(tabId, btn) {
        // Hide all content
        var contents = document.querySelectorAll(".tab-content");
        for (var i = 0; i < contents.length; i++) {
            contents[i].classList.remove("active");
        }

        // Remove active from all buttons
        var buttons = document.querySelectorAll(".tab-btn");
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }

        // Show selected
        document.getElementById(tabId).classList.add("active");
        btn.classList.add("active");
    }
</script>

</body>
</html>
