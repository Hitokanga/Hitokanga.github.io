<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 3 - Student Grade Calculator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table {
            border-collapse: collapse;
            width: 50%;
            margin: 20px 0;
        }
        th, td {
            border: 1px solid #999;
            padding: 8px 12px;
            text-align: left;
        }
        tr:nth-child(even) { background-color: #f2f2f2; }
        tr:nth-child(odd)  { background-color: #ffffff; }
        button { padding: 8px 20px; margin-top: 10px; cursor: pointer; }
        #result { margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<h2>Exercise 3 - Student Grade Calculator &reg;</h2>
<p>&sect; Grades must be &ge; 0 to be counted.</p>

<table>
    <tr>
        <th>Subject</th>
        <th>Grade</th>
    </tr>
    <tr>
        <td>Math</td>
        <td class="grade">85</td>
    </tr>
    <tr>
        <td>English</td>
        <td class="grade">90</td>
    </tr>
    <tr>
        <td>Physics</td>
        <td class="grade">78</td>
    </tr>
    <tr>
        <td>History</td>
        <td class="grade">92</td>
    </tr>
</table>

<button onclick="calculateAverage()">Calculate Average</button>
<p id="result"></p>

<script>
    function calculateAverage() {
        var cells = document.querySelectorAll(".grade");
        var total = 0;
        for (var i = 0; i < cells.length; i++) {
            total += parseFloat(cells[i].innerText);
        }
        var avg = total / cells.length;
        document.getElementById("result").textContent = "Average grade: " + avg.toFixed(2);
    }
</script>

</body>
</html>
