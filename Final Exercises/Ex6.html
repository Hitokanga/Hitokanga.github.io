<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 6 - Bookstore Navigation</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        nav {
            background-color: #333;
            padding: 12px 20px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 0 8px;
        }
        nav a:hover { color: #4CAF50; }
        nav.hidden { display: none; }
        button { padding: 8px 20px; margin-bottom: 10px; cursor: pointer; }
    </style>
</head>
<body>

<h2>Exercise 6 - Bookstore Navigation</h2>

<button onclick="toggleMenu()">Toggle Menu</button>

<nav id="mainNav">
    <a href="#">Home</a> &bull;
    <a href="#">Books &copy;</a> &bull;
    <a href="#">Authors &trade;</a> &bull;
    <a href="#">Contact</a>
</nav>

<script>
    function toggleMenu() {
        var nav = document.getElementById("mainNav");
        nav.classList.toggle("hidden");
    }
</script>

</body>
</html>
