<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 14px;
      background: #fff;
      color: #000;
      margin: 0;
      padding: 0;
    }

    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: 30px 20px;
      position: relative;
    }


    .page-label {
      position: absolute;
      top: 30px;
      right: 20px;
      font-size: 14px;
      color: #000;
    }


    .form-title {
      color: #cc0000;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    hr {
      border: none;
      border-top: 1px solid #999;
      margin: 6px 0 14px 0;
    }


    table {
      border-collapse: collapse;
      width: 100%;
    }

    td {
      padding: 5px 4px;
      vertical-align: middle;
    }

    td.label-cell {
      width: 120px;
      text-align: right;
      padding-right: 10px;
      white-space: nowrap;
      color: #000;
      vertical-align: top;
      padding-top: 7px;
    }


    input[type="text"],
    input[type="password"] {
      width: 180px;
      height: 22px;
      border: 1px solid #999;
      padding: 2px 4px;
      font-size: 13px;
      box-sizing: border-box;
    }


    .birthday-row {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    select#month {
      height: 24px;
      font-size: 13px;
      border: 1px solid #999;
      background: #fff;
    }

    input.bday-day,
    input.bday-year {
      width: 52px;
      height: 22px;
      border: 1px solid #999;
      padding: 2px 4px;
      font-size: 13px;
      box-sizing: border-box;
    }

    .bday-hint {
      font-size: 13px;
      color: #000;
      margin-left: 4px;
    }


    input[type="file"] {
      font-size: 13px;
    }


    .name-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .name-row label {
      font-size: 13px;
      white-space: nowrap;
    }

    input.name-input {
      width: 110px;
      height: 22px;
      border: 1px solid #999;
      padding: 2px 4px;
      font-size: 13px;
      box-sizing: border-box;
    }


    .interests-label {
      color: #cc0000;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .interests-grid {
      display: grid;
      grid-template-columns: 200px 200px;
      gap: 4px 20px;
      padding-left: 8px;
    }

    .interest-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }

    .interest-item input[type="checkbox"] {
      width: 14px;
      height: 14px;
      margin: 0;
    }

    .interest-item label {
      color: #336699;
      cursor: pointer;
    }


    .btn-wrap {
      text-align: center;
      margin-top: 20px;
    }

    input[type="submit"] {
      background: #cc2200;
      color: #fff;
      font-size: 15px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      letter-spacing: 0.08em;
      padding: 8px 28px;
      border: 2px solid #991100;
      border-radius: 20px;
      cursor: pointer;
      text-transform: uppercase;
    }

    input[type="submit"]:hover {
      background: #aa1a00;
    }


    .section-gap {
      height: 10px;
    }
  </style>
</head>
<body>

<div class="page">

  <div class="page-label">Web Design and Development</div>

  <form action="#" method="post" enctype="multipart/form-data">


    <div class="form-title">Registration</div>
    <hr>

    <table>
      <tr>
        <td class="label-cell"><label for="username">Username:</label></td>
        <td><input type="text" id="username" name="username"></td>
      </tr>
      <tr>
        <td class="label-cell"><label for="password">Password:</label></td>
        <td><input type="password" id="password" name="password"></td>
      </tr>
      <tr>
        <td class="label-cell"><label for="repassword">Re-type<br>Password:</label></td>
        <td><input type="password" id="repassword" name="repassword"></td>
      </tr>
    </table>

    <hr>


    <table>
      <tr>
        <td class="label-cell"><label for="month">Birthday:</label></td>
        <td>
          <div class="birthday-row">
            <select id="month" name="month">
              <option value="">[select one]</option>
              <option value="1">January</option>
              <option value="2">February</option>
              <option value="3">March</option>
              <option value="4">April</option>
              <option value="5">May</option>
              <option value="6">June</option>
              <option value="7">July</option>
              <option value="8">August</option>
              <option value="9">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December</option>
            </select>
            <span>,</span>
            <input type="text" class="bday-day"  name="day"  aria-label="Day"  placeholder="">
            <span>,</span>
            <input type="text" class="bday-year" name="year" aria-label="Year" placeholder="">
            <span class="bday-hint">(Month Day, Year)</span>
          </div>
        </td>
      </tr>
      <tr>
        <td class="label-cell"><label for="image">Images:</label></td>
        <td><input type="file" id="image" name="image" accept="image/*"></td>
      </tr>
    </table>

    <hr>


    <table>
      <tr>
        <td style="padding: 5px 4px;">
          <div class="name-row">
            <label for="firstname">First Name:</label>
            <input type="text" id="firstname" name="firstname" class="name-input">
            <label for="lastname">Last Name:</label>
            <input type="text" id="lastname"  name="lastname"  class="name-input">
          </div>
        </td>
      </tr>
    </table>

    <hr>

    <p class="interests-label"><strong>Interests (optional):</strong></p>

    <div class="interests-grid">
      <div class="interest-item">
        <input type="checkbox" id="entertainment" name="interests" value="entertainment">
        <label for="entertainment">Entertainment</label>
      </div>
      <div class="interest-item">
        <input type="checkbox" id="business" name="interests" value="business">
        <label for="business">Business</label>
      </div>
      <div class="interest-item">
        <input type="checkbox" id="homefamily" name="interests" value="homefamily">
        <label for="homefamily">Home &amp; Family</label>
      </div>
      <div class="interest-item">
        <input type="checkbox" id="computers" name="interests" value="computers">
        <label for="computers">Computers &amp; Technology</label>
      </div>
      <div class="interest-item">
        <input type="checkbox" id="health" name="interests" value="health">
        <label for="health">Health</label>
      </div>
      <div class="interest-item">
        <input type="checkbox" id="personalfinance" name="interests" value="personalfinance">
        <label for="personalfinance">Personal Finance</label>
      </div>
      <div class="interest-item">
        <input type="checkbox" id="music" name="interests" value="music">
        <label for="music">Music</label>
      </div>
      <div class="interest-item">
        <input type="checkbox" id="smallbusiness" name="interests" value="smallbusiness">
        <label for="smallbusiness">Small Business</label>
      </div>
    </div>

    <hr style="margin-top: 14px;">

    <div class="btn-wrap">
      <input type="submit" value="REGISTER">
    </div>

  </form>

</div>

</body>
</html>
